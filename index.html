<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سداد لينك</title>
<style>
:root{--navy:#192f70;--blue:#25469b;--bg:#f1f4fa;--green:#16834a;--red:#b43b45;--site-text:#182c69;--site-card:#fff;--site-button-text:#fff;--site-nav:#192f70;--site-nav-text:#fff;--site-tile:#192f70;--site-border:#d8deeb;--site-muted:#71809e;--site-success:#16834a;--site-danger:#b43b45;--site-notice:#edf7f0;--site-pill:#e9efff;--site-font:Arial}
*{box-sizing:border-box}body{margin:0;font-family:var(--site-font);background:var(--bg);color:var(--site-text);padding-bottom:72px}
.head{background:linear-gradient(130deg,var(--navy),var(--blue));color:white;padding:20px 18px 24px;border-radius:0 0 26px 26px}
.top{display:flex;justify-content:space-between;align-items:center}.top>b{font-size:21px}.head h2{margin:16px 0 5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--site-card);color:var(--site-text);border-radius:16px;padding:12px;margin-top:16px;text-align:center}.stats b{display:block;font-size:21px;margin-top:5px}
.section{padding:16px 14px 7px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:10px}.tile{background:var(--site-card);border-radius:15px;overflow:hidden;text-align:center;box-shadow:0 2px 7px #0000000a}.tile .i{padding:19px;font-size:31px}.tile strong{display:block;background:var(--site-tile);color:var(--site-button-text);padding:12px 4px;font-size:13px}
.panel{background:var(--site-card);margin:12px;padding:14px;border-radius:15px}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--site-nav);display:flex;justify-content:space-around;padding:12px;z-index:4}.bottom button{color:var(--site-nav-text);background:none;border:0;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:14px;z-index:10}.modal.show{display:flex}.box{background:var(--site-card);border-radius:18px;padding:18px;max-height:90vh;overflow:auto;width:100%;max-width:460px;color:var(--site-text)}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid var(--site-border);border-radius:9px;font:inherit}button{cursor:pointer}.action{width:100%;padding:12px;border:0;border-radius:10px;background:var(--navy);color:var(--site-button-text);margin:5px 0;font:inherit}.muted{color:var(--site-muted);font-size:12px}.item{padding:12px 2px;.item{border-bottom:1px solid var(--site-border)}}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:var(--site-pill);color:var(--site-text);font-size:12px}.notice{padding:10px;border-radius:10px;background:var(--site-notice);margin:8px 0}.danger{background:var(--site-danger);color:#fff}.hidden{display:none}
@media(max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="head"><div class="top"><b>سداد لينك</b><button style="background:transparent;color:white;border:0" onclick="account()">☰ حسابي</button></div>
<h2 id="welcome">مرحباً بك في سداد لينك</h2><div id="phone" class="muted" style="color:#dce5ff">خدمات السداد وشحن المحفظة</div>
<div class="stats"><div>رصيدي<b id="balance">—</b><small>ريال</small></div><div>الطلبات<b id="requests">0</b></div><div>العمليات<b id="operations">0</b></div></div></header>
<div class="section">الخدمات</div>
<section class="grid">
<div class="tile" onclick="networks()"><div class="i">📶</div><strong>شبكات الإنترنت</strong></div>
<div class="tile" onclick="telecoms()"><div class="i">📱</div><strong>شركات الاتصالات</strong></div>
<div class="tile" onclick="billForm()"><div class="i">💧</div><strong>الماء والكهرباء</strong></div>
<div class="tile" onclick="topup()"><div class="i">➕</div><strong>شحن المحفظة</strong></div>
<div class="tile" onclick="otherServices()"><div class="i">🛍️</div><strong>خدمات أخرى</strong></div>
<div class="tile" onclick="notifications()"><div class="i">🔔</div><strong>الإشعارات</strong></div>
</section>
<div class="section">آخر الإشعارات</div><div class="panel" id="latest">سجل الدخول لمتابعة إشعاراتك.</div>
<nav class="bottom"><button onclick="account()">حسابي</button><button onclick="history()">سجل العمليات</button><button onclick="refresh()">الرئيسية</button></nav>
<div class="modal" id="modal"><div class="box"><h3 id="modalTitle"></h3><div id="modalBody"></div><button class="action" onclick="closeModal()">إغلاق</button></div></div>
<script>
let me=null, cache={};
const $=id=>document.getElementById(id);
async function api(path,body){let r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},credentials:'include',body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'تعذر تنفيذ الطلب');return j}
function modal(t,h){$('modalTitle').textContent=t;$('modalBody').innerHTML=h;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Number(n||0).toLocaleString('ar-YE')}
async function applyAppearance(){try{const v=await api('appearance'),r=document.documentElement.style;r.setProperty('--navy',v.primary);r.setProperty('--blue',v.secondary);r.setProperty('--bg',v.background);r.setProperty('--site-text',v.text);r.setProperty('--site-card',v.card);r.setProperty('--site-button-text',v.buttonText);r.setProperty('--site-nav',v.nav);r.setProperty('--site-nav-text',v.navText);r.setProperty('--site-tile',v.tileLabel);r.setProperty('--site-border',v.border);r.setProperty('--site-muted',v.muted);r.setProperty('--site-success',v.success);r.setProperty('--site-danger',v.danger);r.setProperty('--site-notice',v.notice);r.setProperty('--site-pill',v.pill);r.setProperty('--site-font',v.font||'Arial')}catch(e){console.warn('appearance',e.message)}}
async function refresh(){try{let d=await api('me');me=d.user;cache=d; $('welcome').textContent=me?'مرحباً '+me.name:'مرحباً بك في سداد لينك';$('phone').textContent=me?me.phone:'خدمات السداد وشحن المحفظة';$('balance').textContent=me?money(me.balance):'—';$('requests').textContent=me?d.pendingCount:0;$('operations').textContent=me?d.orderCount:0;$('latest').innerHTML=me?(d.notifications.slice(0,3).map(n=>`<div class="item"><b>${esc(n.title)}</b><div>${esc(n.message)}</div><small class="muted">${esc(n.createdAtText||'')}</small></div>`).join('')||'لا توجد إشعارات جديدة'):'سجل الدخول لعرض رصيدك وإشعاراتك.'}catch(e){$('latest').textContent='تعذر تحديث البيانات: '+(e.message||'خطأ غير معروف')}}
function account(){modal('حسابي',me?`<div class="notice">مرحباً ${esc(me.name)}<br>رصيدك: <b>${money(me.balance)} ريال</b></div><button class="action" onclick="topup()">شحن المحفظة</button><button class="action" onclick="notifications()">الإشعارات والردود</button><button class="action" onclick="logout()">تسجيل الخروج</button>`:`<button class="action" onclick="loginForm()">تسجيل الدخول</button><button class="action" onclick="registerForm()">إنشاء حساب جديد</button>`) }
function loginForm(){modal('تسجيل الدخول',`<input id="username" placeholder="اسم المستخدم" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button class="action" onclick="login()">دخول</button>`)}
function registerForm(){modal('إنشاء حساب',`<input id="name" placeholder="الاسم الكامل"><input id="phoneInput" placeholder="رقم الهاتف"><input id="username" placeholder="اسم المستخدم"><input id="password" type="password" placeholder="كلمة المرور"><button class="action" onclick="register()">إنشاء الحساب</button>`)}
async function login(){try{await api('auth/login',{username:$('username').value,password:$('password').value});closeModal();await refresh()}catch(e){alert(e.message)}}
async function register(){try{await api('auth/register',{name:$('name').value,phone:$('phoneInput').value,username:$('username').value,password:$('password').value});closeModal();await refresh();alert('تم إنشاء حسابك وتفعيله بنجاح. مرحباً بك في سداد لينك.')}catch(e){alert(e.message)}}
async function logout(){try{await api('auth/logout',{})}catch{}me=null;closeModal();refresh()}
function needLogin(){if(!me){loginForm();return false}return true}
async function topup(){if(!needLogin())return;try{const d=await api('bank-accounts');const banks=d.items||[],profile=d.profile||{};let html='<h4>بيانات المستفيد من التحويل</h4><div class="notice"><b>اسم صاحب الحساب:</b> '+esc(profile.owner||'غير محدد')+'<br><b>رقم الجوال:</b> '+esc(profile.phone||'غير محدد')+(profile.phone?'<br><a class="action" style="display:inline-block;text-decoration:none;margin-top:8px" target="_blank" rel="noopener" href="https://wa.me/'+profile.phone.replace(/[^0-9]/g,'')+'">التواصل عبر واتساب</a>':'')+'</div><h4>حسابات البنوك للتحويل</h4>';html+=banks.length?banks.map(x=>'<div class="notice"><b>اسم البنك: '+esc(x.bank)+'</b><br><b>رقم الحساب:</b> <span dir="ltr">'+esc(x.account)+'</span></div>').join(''):'<p class="muted">لا توجد حسابات بنكية مضافة حالياً.</p>';html+='<input id="amount" type="number" min="1" placeholder="مبلغ الإيداع بالريال"><input id="reference" placeholder="رقم الحوالة (اختياري)"><input id="proof" type="file" accept="image/*"><textarea id="note" placeholder="ملاحظات (اختياري)"></textarea><button class="action" onclick="sendTopup()">إرسال صورة سند الإيداع</button><p class="muted">بعد الإرسال سيظهر السند لدى الإدارة للمراجعة، ويضاف الرصيد بعد اعتماده فقط.</p>';modal('شحن المحفظة',html)}catch(e){alert(e.message)}}
async function imageData(file){if(!file)throw Error('اختر صورة سند الإيداع');if(!file.type.startsWith('image/'))throw Error('الملف يجب أن يكون صورة');const img=new Image(),url=URL.createObjectURL(file);await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});const c=document.createElement('canvas'),scale=Math.min(1,1100/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',.72)}
async function sendTopup(){try{const proof=await imageData($('proof').files[0]);await api('topups',{amount:+$('amount').value,reference:$('reference').value,note:$('note').value,proof});closeModal();await refresh();alert('تم إرسال سند الإيداع للإدارة للمراجعة')}catch(e){alert(e.message)}}
async function networks(){if(!needLogin())return;try{let d=await api('catalog');cache=d;if(!d.networks.length){modal('شبكات الإنترنت','لا توجد شبكات متاحة حالياً');return}let html='<label>اختر الشبكة</label><select id="customerNetwork" onchange="showNetworkPlans()">'+d.networks.map(n=>'<option value="'+n.id+'">'+esc(n.name)+'</option>').join('')+'</select><div id="customerPlans"></div>';modal('اختر الشبكة',html);showNetworkPlans()}catch(e){alert(e.message)}}
function showNetworkPlans(){const n=cache.networks.find(x=>x.id===$('customerNetwork').value);$('customerPlans').innerHTML=n&&n.plans.length?'<label>اختر الباقة</label><select id="customerPlan">'+n.plans.map(p=>'<option value="'+p.id+'" '+(p.stock<1?'disabled':'')+'>'+esc(p.name)+' · '+esc(p.volume)+' · '+esc(p.validity)+' · '+money(p.price)+' ريال · متاح '+p.stock+'</option>').join('')+'</select><button class="action" onclick="buySelectedNetworkPlan()">شراء الباقة</button>':'لا توجد باقات متاحة لهذه الشبكة'}
function buySelectedNetworkPlan(){const n=$('customerNetwork').value,p=$('customerPlan')?.value;if(!p){alert('لا توجد كروت متاحة لهذه الباقة');return}buyNetwork(n,p)}
async function buyNetwork(networkId,planId){let q=prompt('كمية الكروت المطلوبة؟','1');if(q===null)return;try{let r=await api('purchase/network',{networkId,planId,quantity:+q});modal('تم الشراء',r.cards.map(c=>`<div class="notice">اسم المستخدم: <b>${esc(c.username)}</b>${c.password?'<br>كلمة المرور: <b>'+esc(c.password)+'</b>':''}</div>`).join(''));await refresh()}catch(e){alert(e.message)}}
async function telecoms(){if(!needLogin())return;try{let d=await api('catalog');window.telCatalog=d.telecoms||[];if(!telCatalog.length){modal('شركات الاتصالات','لا توجد شركات مضافة');return}modal('اختر شركة الاتصالات','<label>الشركة</label><select id="telCompany" onchange="showTelTypes()">'+telCatalog.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select><div id="telTypeArea"></div>');showTelTypes()}catch(e){alert(e.message)}}
function showTelTypes(){const t=telCatalog.find(x=>x.id===$('telCompany').value);const types=[...new Set((t?.packages||[]).map(p=>p.simType||'عام'))];$('telTypeArea').innerHTML='<label>نوع الشريحة</label><select id="telSimType" onchange="showTelPackages()">'+types.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><div id="telPackages"></div>';showTelPackages()}
function showTelPackages(){const t=telCatalog.find(x=>x.id===$('telCompany').value),type=$('telSimType').value,ps=(t?.packages||[]).filter(p=>(p.simType||'عام')===type);$('telPackages').innerHTML='<label>نوع الباقة</label><select id="telPackage">'+ps.map(p=>'<option value="'+p.id+'">'+esc(p.category)+' · '+esc(p.name)+' · '+money(p.price)+' ريال</option>').join('')+'</select><label>رقم الهاتف المراد شحنه</label><input id="telTarget" type="tel" inputmode="tel" placeholder="رقم الهاتف" value="'+esc($('chargePhone')?.value||me?.phone||'')+'"><button class="action" onclick="buyTelSelected()">متابعة الشراء</button>'}
async function buyTelSelected(){const target=$('telTarget').value;if(!target.trim()){alert('أدخل رقم الهاتف');return}await buyTel($('telCompany').value,$('telPackage').value,target)}
async function buyTel(companyId,packageId,target){try{await api('purchase/telecom',{companyId,packageId,target});closeModal();await refresh();alert('تم تسجيل طلب الشحن وسيصلك إشعار عند تنفيذه')}catch(e){alert(e.message)}}
function billForm(){if(!needLogin())return;modal('تسديد الماء والكهرباء',`<select id="billType"><option>ماء</option><option>كهرباء</option></select><input id="area" placeholder="المنطقة / المؤسسة"><input id="subscriber" placeholder="رقم الاشتراك أو العداد"><input id="invoice" placeholder="رقم الفاتورة"><input id="billAmount" type="number" min="1" placeholder="المبلغ"><button class="action" onclick="sendBill()">إرسال طلب التسديد</button>`)}
async function sendBill(){try{await api('bills',{service:$('billType').value,area:$('area').value,subscriber:$('subscriber').value,invoice:$('invoice').value,amount:+$('billAmount').value});closeModal();await refresh();alert('تم إرسال طلب التسديد للمراجعة')}catch(e){alert(e.message)}}
async function otherServices(){if(!needLogin())return;try{let d=await api('catalog');const services=d.services||[];modal('خدمات أخرى',services.map(x=>'<div class="item"><b>'+esc(x.name)+'</b><br>'+(x.kind==='tiktok'?(x.coins||0)+' عملة تيك توك · ':'')+x.price+' '+(x.currency==='USD'?'دولار':'ريال يمني')+'<button class="action" onclick="buyService(\''+x.id+'\',\''+x.kind+'\')">طلب الخدمة</button></div>').join('')||'لا توجد خدمات حالياً')}catch(e){alert(e.message)}}
async function buyService(id,kind){let player='';if(kind==='tiktok'){player=prompt('أدخل اسم اللاعب في تيك توك');if(player===null||!player.trim())return}else{player=prompt('أدخل تفاصيل الطلب');if(player===null)return}try{await api('purchase/service',{serviceId:id,player,details:player});closeModal();await refresh();alert('تم إرسال طلبك بنجاح')}catch(e){alert(e.message)}}
async function notifications(){if(!needLogin())return;try{let d=await api('notifications');modal('الإشعارات والردود',d.items.map(n=>`<div class="item"><b>${esc(n.title)}</b><p>${esc(n.message)}</p><small class="muted">${esc(n.createdAtText||'')}</small></div>`).join('')||'لا توجد إشعارات')}catch(e){alert(e.message)}}
async function history(){if(!needLogin())return;try{let d=await api('history');modal('سجل العمليات',d.items.map(o=>`<div class="item"><b>${esc(o.title)}</b><br>${money(o.amount)} ريال · <span class="pill">${esc(o.status)}</span><p>${esc(o.details||'')}</p></div>`).join('')||'لا توجد عمليات')}catch(e){alert(e.message)}}
applyAppearance();refresh();
</script></body></html>
