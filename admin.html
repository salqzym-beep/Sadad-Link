<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة سداد لينك</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f8;color:#192e70;font-family:Arial;padding:14px}main{max-width:1050px;margin:auto}header{background:linear-gradient(130deg,#192f70,#3157a8);color:white;padding:20px;border-radius:17px}section,.card{background:white;padding:15px;border-radius:14px;margin:12px 0;box-shadow:0 2px 8px #0001}input,select,textarea{width:100%;padding:11px;border:1px solid #d9dfeb;border-radius:9px;margin:5px 0;font:inherit}button{background:#192f70;color:white;border:0;border-radius:9px;padding:10px;margin:4px;cursor:pointer}.ok{background:#16834a}.bad{background:#b43b45}.tabs{display:flex;flex-wrap:wrap;gap:4px}.line{border-bottom:1px solid #edf0f5;padding:12px 0}.muted{font-size:12px;color:#71809e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
</style></head><body><main><header><h2>لوحة إدارة سداد لينك</h2><div>إدارة المحافظ والشبكات والباقات وطلبات التسديد والعملاء</div></header><div id="app"></div></main>
<script>
const $=id=>document.getElementById(id);let currentSection='dashboard';
async function api(path,body){let r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},credentials:'include',body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'تعذر تنفيذ العملية');return j}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function login(){ $('app').innerHTML=`<section><h3>دخول الإدارة</h3><input id="u" placeholder="اسم المستخدم"><input id="p" type="password" placeholder="كلمة المرور"><button onclick="doLogin()">دخول</button><p class="muted">في أول تشغيل ستظهر شاشة إنشاء المدير الأول.</p></section>`}
async function init(){try{let s=await api('admin/status');if(!s.initialized){$('app').innerHTML=`<section><h3>إنشاء المدير الأول</h3><p>هذه الخطوة تظهر مرة واحدة فقط.</p><input id="name" placeholder="اسم المدير"><input id="u" placeholder="اسم المستخدم"><input id="p" type="password" placeholder="كلمة مرور قوية"><button class="ok" onclick="bootstrap()">إنشاء حساب المدير</button></section>`;return}try{let m=await api('admin/me');if(m.admin){render();return}}catch(authError){}login()}catch(e){$('app').innerHTML='<section>تعذر الاتصال بالخادم: '+esc(e.message)+'</section>'}}
async function bootstrap(){try{await api('admin/bootstrap',{name:$('name').value,username:$('u').value,password:$('p').value});await init()}catch(e){alert(e.message)}}
async function doLogin(){try{await api('admin/login',{username:$('u').value,password:$('p').value});render()}catch(e){alert(e.message)}}
function render(){ $('app').innerHTML=`<section class="grid"><div><b>لوحة التحكم</b><div class="muted">مرحباً بك في إدارة سداد لينك</div></div><button onclick="logout()">تسجيل الخروج</button></section><div class="tabs"><button onclick="section('dashboard')">الرئيسية</button><button onclick="section('topups')">طلبات شحن الرصيد</button><button onclick="section('networks')">الشبكات والكروت</button><button onclick="section('telecoms')">الاتصالات والباقات</button><button onclick="section('bills')">الماء والكهرباء</button><button onclick="section('orders')">طلبات الخدمات</button><button onclick="section('userRequests')">طلبات إنشاء الحساب</button><button onclick="section('customers')">العملاء</button><button onclick="section('messages')">إرسال إشعار</button><button onclick="section('admins')">المدراء</button><button onclick="section('settings')">بيانات الدخول</button></div><div id="panel" class="card">جار التحميل...</div>`;section('dashboard')}
async function section(s){currentSection=s;let p=$('panel');try{let d;
if(s==='dashboard'){d=await api('admin/dashboard');p.innerHTML=`<div class="grid">${Object.entries(d).map(([k,v])=>`<section><b>${esc(k)}</b><h2>${esc(v)}</h2></section>`).join('')}</div>`}
if(s==='topups'){d=await api('admin/topups');p.innerHTML='<h3>طلبات شحن الرصيد</h3>'+d.items.map(x=>`<div class="line"><b>${esc(x.customer)}</b> · ${x.amount} ريال · المرجع ${esc(x.reference)} · ${esc(x.status)}<p>${esc(x.note)}</p>${x.status==='pending'?`<button class="ok" onclick="review('topup','${x.id}','approved')">اعتماد وإضافة الرصيد</button><button class="bad" onclick="review('topup','${x.id}','rejected')">رفض</button>`:''}<button onclick="reply('${x.userId}','${x.id}')">إرسال رد للعميل</button></div>`).join('')||'لا توجد طلبات'}
if(s==='networks'){d=await api('admin/catalog');p.innerHTML=`<h3>إضافة شبكة</h3><input id="networkName" placeholder="اسم الشبكة"><button onclick="addNetwork()">إضافة الشبكة</button><hr><h3>إضافة باقة ومخزون الكروت</h3><select id="networkId">${d.networks.map(n=>`<option value="${n.id}">${esc(n.name)}</option>`).join('')}</select><input id="planName" placeholder="اسم الباقة"><input id="volume" placeholder="الحجم"><input id="validity" placeholder="الصلاحية"><input id="price" type="number" placeholder="السعر"><textarea id="cards" rows="5" placeholder="كل كرت في سطر، username:password إذا توجد كلمة مرور"></textarea><button class="ok" onclick="addPlan()">حفظ الباقة والكروت</button><hr>${d.networks.map(n=>`<h4>${esc(n.name)}</h4>${n.plans.map(x=>`<div class="line">${esc(x.name)} · ${esc(x.volume)} · ${esc(x.validity)} · ${x.price} ريال · متاح ${x.stock} · مباع ${x.sold}</div>`).join('')}`).join('')}`}
if(s==='telecoms'){d=await api('admin/catalog');p.innerHTML=`<h3>إضافة شركة اتصالات</h3><input id="companyName" placeholder="اسم الشركة"><button onclick="addCompany()">إضافة الشركة</button><hr><h3>إضافة باقة</h3><select id="companyId">${d.telecoms.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><input id="telName" placeholder="اسم الباقة"><input id="category" placeholder="نوع الباقة: إنترنت / مكالمات"><input id="telPrice" type="number" placeholder="السعر"><button onclick="addTelPackage()">إضافة الباقة</button><hr>${d.telecoms.map(t=>`<h4>${esc(t.name)}</h4>${t.packages.map(x=>`<div class="line">${esc(x.name)} · ${esc(x.category)} · ${x.price} ريال</div>`).join('')}`).join('')}`}
if(s==='bills'||s==='orders'){d=await api('admin/orders');let arr=d.items.filter(x=>s==='bills'?x.kind==='bill':x.kind!=='bill');p.innerHTML='<h3>'+(s==='bills'?'طلبات الماء والكهرباء':'طلبات الخدمات والمشتريات')+'</h3>'+arr.map(x=>`<div class="line"><b>${esc(x.customer)}</b> · ${esc(x.title)} · ${x.amount} ريال · ${esc(x.status)}<p>${esc(x.details)}</p>${['pending','processing'].includes(x.status)?`<button class="ok" onclick="orderStatus('${x.id}','completed')">تم التنفيذ</button><button onclick="orderStatus('${x.id}','processing')">قيد التنفيذ</button><button class="bad" onclick="orderStatus('${x.id}','rejected')">رفض وإرجاع المبلغ</button>`:''}<button onclick="reply('${x.userId}','${x.id}')">رد للعميل</button></div>`).join('')||'لا توجد طلبات'}
if(s==='userRequests'){d=await api('admin/user-requests');p.innerHTML='<h3>طلبات إنشاء حسابات جديدة</h3>'+d.items.map(x=>'<div class="line"><b>'+esc(x.name)+'</b> · '+esc(x.username)+'<br>الهاتف: '+esc(x.phone)+'<br><button class="ok" onclick="reviewUser(\''+x.id+'\',\'approved\')">قبول وتفعيل الحساب</button><button class="bad" onclick="reviewUser(\''+x.id+'\',\'rejected\')">رفض الطلب</button></div>').join('')||'لا توجد طلبات معلقة'}\nif(s==='customers'){d=await api('admin/customers');p.innerHTML='<h3>العملاء والأرصدة</h3>'+d.items.map(x=>`<div class="line"><b>${esc(x.name)}</b> (${esc(x.username)}) · ${x.balance} ريال <button onclick="adjust('${x.id}')">تعديل الرصيد</button><button onclick="reply('${x.id}','')">إرسال إشعار</button></div>`).join('')||'لا يوجد عملاء'}
if(s==='messages'){d=await api('admin/customers');p.innerHTML=`<h3>إرسال إشعار إلى عميل</h3><select id="targetUser">${d.items.map(x=>`<option value="${x.id}">${esc(x.name)} - ${esc(x.username)}</option>`).join('')}</select><input id="msgTitle" placeholder="عنوان الإشعار"><textarea id="msgBody" placeholder="اكتب الرد أو الإشعار"></textarea><button class="ok" onclick="sendMessage()">إرسال الإشعار</button>`}
if(s==='admins'){d=await api('admin/admins');p.innerHTML=`<h3>إضافة مدير جديد</h3><input id="adminName" placeholder="اسم المدير"><input id="adminUser" placeholder="اسم المستخدم"><input id="adminPass" type="password" placeholder="كلمة المرور"><button onclick="addAdmin()">إضافة مدير</button><hr><h3>المدراء</h3>${d.items.map(x=>`<div class="line">${esc(x.name)} · ${esc(x.username)} · ${x.active?'نشط':'موقوف'}</div>`).join('')}`}
if(s==='settings'){p.innerHTML=`<h3>تغيير بيانات دخولي</h3><input id="newUsername" placeholder="اسم المستخدم الجديد"><input id="oldPassword" type="password" placeholder="كلمة المرور الحالية للتأكيد"><input id="newPassword" type="password" placeholder="كلمة المرور الجديدة (اختياري)"><button onclick="saveCredentials()">حفظ التعديلات</button>`}
}catch(e){p.innerHTML='حدث خطأ: '+esc(e.message)}}
async function reviewUser(userId,status){try{await api('admin/user-review',{userId,status});section('userRequests')}catch(e){alert(e.message)}}\nasync function review(kind,id,status){try{await api('admin/review',{kind,id,status});section(currentSection)}catch(e){alert(e.message)}}
async function orderStatus(id,status){try{await api('admin/order-status',{id,status});section(currentSection)}catch(e){alert(e.message)}}
async function addNetwork(){try{await api('admin/network',{name:$('networkName').value});section('networks')}catch(e){alert(e.message)}}
async function addPlan(){try{await api('admin/plan',{networkId:$('networkId').value,name:$('planName').value,volume:$('volume').value,validity:$('validity').value,price:+$('price').value,cards:$('cards').value});section('networks')}catch(e){alert(e.message)}}
async function addCompany(){try{await api('admin/company',{name:$('companyName').value});section('telecoms')}catch(e){alert(e.message)}}
async function addTelPackage(){try{await api('admin/telecom-package',{companyId:$('companyId').value,name:$('telName').value,category:$('category').value,price:+$('telPrice').value});section('telecoms')}catch(e){alert(e.message)}}
async function adjust(id){let amount=prompt('أدخل الرصيد الجديد');if(amount===null)return;try{await api('admin/adjust-balance',{userId:id,balance:+amount});section('customers')}catch(e){alert(e.message)}}
async function reply(userId,ref){let title=prompt('عنوان الرد أو الإشعار','تحديث طلبك');if(!title)return;let message=prompt('اكتب الرد للعميل');if(!message)return;try{await api('admin/message',{userId,title,message,ref});alert('تم إرسال الإشعار');section(currentSection)}catch(e){alert(e.message)}}
async function sendMessage(){try{await api('admin/message',{userId:$('targetUser').value,title:$('msgTitle').value,message:$('msgBody').value});alert('تم إرسال الإشعار');section('messages')}catch(e){alert(e.message)}}
async function addAdmin(){try{await api('admin/add-admin',{name:$('adminName').value,username:$('adminUser').value,password:$('adminPass').value});section('admins')}catch(e){alert(e.message)}}
async function saveCredentials(){try{await api('admin/credentials',{username:$('newUsername').value,currentPassword:$('oldPassword').value,newPassword:$('newPassword').value});alert('تم تحديث بيانات الدخول');section('settings')}catch(e){alert(e.message)}}
async function logout(){try{await api('admin/logout',{})}catch{}login()}
init();
</script></body></html>
