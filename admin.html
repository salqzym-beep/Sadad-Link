</style><link rel="manifest" href="/admin.webmanifest"><meta name="theme-color" content="#192f70"><link rel="apple-touch-icon" href="/admin-icon.svg"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script></head><body><main><header><h2>لوحة إدارة سداد لينك</h2><div>إدارة المحافظ والشبكات والباقات وطلبات التسديد والعملاء</div></header><section id="appInstall" class="grid" style="display:none"><div><b>تثبيت تطبيق الإدارة</b><div class="muted">ثبّت لوحة التحكم على هاتفك للوصول السريع</div></div><button id="installApp" class="ok">تثبيت التطبيق</button></section><section id="pushSetup" style="display:none"><b>إشعارات الإدارة</b><div id="pushStatus" class="muted">لم يتم تفعيل الإشعارات على هذا الجهاز</div><button id="enablePush" class="ok" onclick="enableAdminPush()">تفعيل الإشعارات</button></section><div id="app"></div></main>

async function checkAdminPushStatus(){
 const status=$('pushStatus'),btn=$('enablePush');
 try{
  if(!('Notification' in window)||Notification.permission!=='granted'||!firebase.messaging.isSupported())return;
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  const registration=await navigator.serviceWorker.register('/admin-sw.js');
  const token=await firebase.messaging().getToken({vapidKey:ADMIN_VAPID_KEY,serviceWorkerRegistration:registration});
  if(!token)return;
  const result=await api('admin/push-status',{token});
  if(result.enabled){status.textContent='الإشعارات مفعّلة على هذا الجهاز';btn.textContent='الإشعارات مفعّلة';btn.disabled=true}
 }catch(e){console.warn('Push status check:',e.message)}
}
async function enableAdminPush(){
 const btn=$('enablePush'),status=$('pushStatus');
 try{
  if(!('Notification' in window)||!('serviceWorker' in navigator)||!firebase.messaging.isSupported())throw Error('هذا المتصفح لا يدعم إشعارات الويب');
  btn.disabled=true;status.textContent='جارٍ تفعيل الإشعارات...';
  const permission=await Notification.requestPermission();
  if(permission!=='granted')throw Error('لم تسمح بإرسال الإشعارات. فعّل الإذن من إعدادات التطبيق.');
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  const registration=await navigator.serviceWorker.register('/admin-sw.js');
  const messaging=firebase.messaging();
  const token=await messaging.getToken({vapidKey:ADMIN_VAPID_KEY,serviceWorkerRegistration:registration});
  if(!token)throw Error('تعذر إنشاء رمز الإشعارات');
  await api('admin/push-token',{token});
  status.textContent='تم تفعيل الإشعارات على هذا الجهاز';localStorage.setItem('sadadAdminPushEnabled','1');
  btn.textContent='تم التفعيل';btn.disabled=false;
  messaging.onMessage(payload=>{const n=payload.notification||{};if(Notification.permission==='granted')new Notification(n.title||'سداد لينك', {body:n.body||'لديك تحديث جديد',icon:'/admin-icon.svg'})});
 }catch(e){status.textContent=e.message;btn.disabled=false;alert(e.message)}
}

if(s==='networks'){const inv=await api('admin/catalog');p.innerHTML='<h3>مخزون الكروت</h3><label>اختر الشبكة</label><select id="inventoryNetwork" onchange="loadInventoryPlans()"><option value="">-- اختر الشبكة --</option>'+inv.networks.map(n=>'<option value="'+n.id+'">'+esc(n.name)+'</option>').join('')+'</select><label>اختر الباقة</label><select id="inventoryPlan" onchange="loadInventoryCards()" disabled><option>اختر الشبكة أولاً</option></select><div id="inventoryCards">اختر الشبكة ثم الباقة لعرض الكروت</div><hr><h3>إضافة شبكة</h3><input id="networkName" placeholder="اسم الشبكة"><button onclick="addNetwork()">إضافة الشبكة</button><hr><h3>إضافة باقة ومخزون الكروت</h3><select id="networkId">'+inv.networks.map(n=>'<option value="'+n.id+'">'+esc(n.name)+'</option>').join('')+'</select><input id="planName" placeholder="اسم الباقة"><input id="volume" placeholder="الحجم"><input id="validity" placeholder="الصلاحية"><input id="price" type="number" placeholder="السعر"><textarea id="cards" rows="5" placeholder="كل كرت في سطر، username:password"></textarea><button class="ok" onclick="addPlan()">حفظ الباقة والكروت</button>'}

async function saveBankAccount(){try{await api('admin/bank-accounts',{id:$('bankId').value,bank:$('bankName').value,account:$('bankNumber').value,active:true});section('banks')}catch(e){alert(e.message)}}
async function deleteBankAccount(id){if(!confirm('حذف هذا الحساب البنكي؟'))return;try{await api('admin/bank-accounts/delete',{id});section('banks')}catch(e){alert(e.message)}}
async function reviewUser(userId,status){try{await api('admin/user-review',{userId,status});section('userRequests')}catch(e){alert(e.message)}}
async function review(kind,id,status){let reason='',approvedAmount;if(kind==='topup'&&status==='approved'){const entered=prompt('اكتب المبلغ الذي اعتمدته أنت لإضافته إلى محفظة العميل:');if(entered===null)return;approvedAmount=Number(entered);if(!Number.isFinite(approvedAmount)||approvedAmount<=0){alert('أدخل مبلغاً صحيحاً أكبر من صفر');return}}if(kind==='topup'&&status==='rejected'){reason=prompt('اكتب سبب رفض سند الإيداع ليظهر للعميل:');if(reason===null)return;if(!reason.trim()){alert('سبب الرفض مطلوب');return}}try{await api('admin/review',{kind,id,status,reason,approvedAmount});section(currentSection)}catch(e){alert(e.message)}}
async function deleteTopup(id){if(!confirm('حذف طلب الشحن؟ لا يؤثر هذا على رصيد العميل.'))return;try{await api('admin/topups/delete',{id});section('topups')}catch(e){alert(e.message)}}
async function editCustomer(id,name,username,phone){const n=prompt('اسم العميل',name);if(n===null)return;const u=prompt('اسم المستخدم',username);if(u===null)return;const ph=prompt('رقم الجوال',phone);if(ph===null)return;const pw=prompt('كلمة مرور جديدة (اتركها فارغة دون تغيير)')||'';try{await api('admin/customer-update',{id,name:n,username:u,phone:ph,newPassword:pw});section('customers')}catch(e){alert(e.message)}}
async function deleteCustomer(id){if(!confirm('تأكيد حذف حساب العميل نهائياً؟ سيختفي من قائمة العملاء ولن يستطيع تسجيل الدخول. ستبقى سجلات الشحن والطلبات المالية محفوظة للمراجعة.'))return;try{await api('admin/customer-delete',{id});alert('تم حذف حساب العميل');section('customers')}catch(e){alert(e.message)}}
async function orderStatus(id,status){try{await api('admin/order-status',{id,status});section(currentSection)}catch(e){alert(e.message)}}
async function loadInventoryPlans(){try{const d=await api('admin/catalog');const n=d.networks.find(x=>x.id===$('inventoryNetwork').value);$('inventoryPlan').innerHTML=n?n.plans.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · متاح '+p.stock+' · مباع '+p.sold+'</option>').join(''):'';await loadInventoryCards()}catch(e){$('inventoryCards').textContent=e.message}}
async function loadInventoryCards(){try{const d=await api('admin/plan-cards',{networkId:$('inventoryNetwork').value,planId:$('inventoryPlan').value});$('inventoryCards').innerHTML='<h4>الكروت ('+d.items.length+')</h4>'+d.items.map(c=>'<div class="line"><b>'+esc(c.username)+'</b> · '+(c.status==='sold'?'<span style="color:#b42318">مباع</span>':'<span style="color:#16834a">جديد</span>')+(c.password?'<br>كلمة المرور: '+esc(c.password):'')+(c.buyer?'<p>بيع إلى: <b>'+esc(c.buyer.name)+'</b><br>اسم المستخدم: '+esc(c.buyer.username)+'<br>الجوال: '+esc(c.buyer.phone)+'</p>':'')+'</div>').join('')||'لا توجد كروت لهذه الباقة'}catch(e){$('inventoryCards').textContent=e.message}}
async function loadInventoryPlans(){let id=$('inventoryNetwork').value,sel=$('inventoryPlan');$('inventoryCards').textContent='';if(!id){sel.disabled=true;sel.innerHTML='<option>اختر الشبكة أولاً</option>';return}let d=await api('admin/catalog'),n=d.networks.find(x=>x.id===id);sel.disabled=false;sel.innerHTML='<option value="">-- اختر الباقة --</option>'+(n?n.plans.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join(''):'');$('inventoryCards').textContent='اختر الباقة'}async function loadInventoryCards(){let id=$('inventoryPlan').value;if(!id){$('inventoryCards').textContent='اختر الباقة';return}let d=await api('admin/plan-cards',{networkId:$('inventoryNetwork').value,planId:id});$('inventoryCards').innerHTML=d.items.map(c=>'<div class="line"><b>'+esc(c.username)+'</b> · '+(c.status==='sold'?'مباع':'جديد')+(c.buyer?'<p>بيع إلى: '+esc(c.buyer.name)+'</p>':'')+'</div>').join('')||'لا توجد كروت'}
async function addNetwork(){try{await api('admin/network',{name:$('networkName').value});section('networks')}catch(e){alert(e.message)}}
async function addPlan(){try{await api('admin/plan',{networkId:$('networkId').value,name:$('planName').value,volume:$('volume').value,validity:$('validity').value,price:+$('price').value,cards:$('cards').value});section('networks')}catch(e){alert(e.message)}}
async function addCompany(){try{await api('admin/company',{name:$('companyName').value});section('telecoms')}catch(e){alert(e.message)}}
async function addService(){try{await api('admin/service',{name:$('serviceName').value,kind:$('serviceKind').value,coins:+$('coins').value,price:+$('servicePrice').value,currency:$('serviceCurrency').value,exchangeRate:+$('serviceRate').value});section('services')}catch(e){alert(e.message)}}
const DEFAULT_APPEARANCE={primary:'#192f70',secondary:'#3157a8',background:'#f1f4fa',text:'#182c69',font:'Arial',card:'#ffffff',buttonText:'#ffffff',nav:'#192f70',navText:'#ffffff',tileLabel:'#192f70',border:'#d8deeb',muted:'#71809e',success:'#16834a',danger:'#b43b45',notice:'#edf7f0',pill:'#e9efff'};
async function saveSmsSettings(){try{await api('admin/sms-settings',{phone:$('smsPhone').value,enabled:$('smsEnabled').checked});alert('تم حفظ رقم استقبال SMS بنجاح');section('settings')}catch(e){alert(e.message)}}
async function saveAppearance(){try{const v={font:$('ap_font').value};Object.keys(DEFAULT_APPEARANCE).filter(k=>k!=='font').forEach(k=>v[k]=$('ap_'+k).value);await api('admin/appearance',v);alert('تم حفظ الألوان وتطبيقها على الموقع');section('settings');}catch(e){alert(e.message)}}
async function resetAppearance(){if(!confirm('إرجاع جميع ألوان الموقع وخطه إلى الوضع الافتراضي؟'))return;try{await api('admin/appearance',DEFAULT_APPEARANCE);alert('تمت استعادة الألوان الافتراضية');section('settings')}catch(e){alert(e.message)}}
async function addTelPackage(){try{await api('admin/telecom-package',{companyId:$('companyId').value,simType:$('simType').value,name:$('telName').value,category:$('category').value,price:+$('telPrice').value});section('telecoms')}catch(e){alert(e.message)}}
async function adjust(id){let amount=prompt('أدخل الرصيد الجديد');if(amount===null)return;try{await api('admin/adjust-balance',{userId:id,balance:+amount});section('customers')}catch(e){alert(e.message)}}
async function reply(userId,ref){let title=prompt('عنوان الرد أو الإشعار','تحديث طلبك');if(!title)return;let message=prompt('اكتب الرد للعميل');if(!message)return;try{await api('admin/message',{userId,title,message,ref});alert('تم إرسال الإشعار');section(currentSection)}catch(e){alert(e.message)}}
async function sendMessage(){try{await api('admin/message',{userId:$('targetUser').value,title:$('msgTitle').value,message:$('msgBody').value});alert('تم إرسال الإشعار');section('messages')}catch(e){alert(e.message)}}
async function addAdmin(){try{await api('admin/add-admin',{name:$('adminName').value,username:$('adminUser').value,password:$('adminPass').value});section('admins')}catch(e){alert(e.message)}}
async function saveCredentials(){try{await api('admin/credentials',{username:$('newUsername').value,currentPassword:$('oldPassword').value,newPassword:$('newPassword').value});alert('تم تحديث بيانات الدخول');section('settings')}catch(e){alert(e.message)}}
async function logout(){try{await api('admin/logout',{})}catch{}login()}
init();
</script></body></html>
